<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09111f" />
    <title>Offline | AU CGPA Calculator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Manrope", system-ui, sans-serif;
        background: #09111f;
        color: #dae2fd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(173, 198, 255, 0.14), transparent 28%),
          linear-gradient(180deg, #09111f 0%, #0b1326 48%, #09111f 100%);
      }

      main {
        width: min(100%, 520px);
        padding: 32px 28px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(19, 27, 46, 0.92);
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.26);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #a8b1c7;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 24px;
        padding: 14px 18px;
        border-radius: 16px;
        background: linear-gradient(135deg, #adc6ff, #7fd5d7);
        color: #08214b;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p style="margin-bottom: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.72rem; font-weight: 700; color: #8c909f;">
        Offline
      </p>
      <h1>Connection required</h1>
      <p>
        The calculator shell is available offline after it has loaded once, but authentication and cloud sync need an
        internet connection. Reconnect and retry to continue.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
